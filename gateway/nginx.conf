server {
    listen 80;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # /api/auth/login -> auth-service /login
    location /api/auth/ {
        proxy_pass http://auth-service:5001/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # /api/students -> student-service /api/students
    location /api/students {
        proxy_pass http://student-service:5002;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
