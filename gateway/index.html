<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}
    .card{border:1px solid #ddd;border-radius:8px;padding:1rem;margin-bottom:1rem}
    form{display:flex;gap:.5rem;flex-wrap:wrap}
    input{padding:.5rem;flex:1;min-width:140px}
    button{padding:.5rem 1rem;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:1rem}
    th,td{border-bottom:1px solid #ddd;padding:.5rem;text-align:left}
    .msg{color:#b00020;min-height:1.2em}
    .hidden{display:none}
    header{display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
<body>
  <h1>Student Management System</h1>

  <section id="auth" class="card">
    <h2>Login or Register</h2>
    <form id="authForm">
      <input id="username" placeholder="Username" required minlength="3">
      <input id="password" type="password" placeholder="Password (6+ chars)" required minlength="6">
      <button type="submit" data-mode="login">Login</button>
      <button type="submit" data-mode="register">Register</button>
    </form>
    <p class="msg" id="authMsg"></p>
  </section>

  <section id="app" class="hidden">
    <header>
      <h2>Students</h2>
      <div><span id="who"></span> <button id="logout">Logout</button></div>
    </header>
    <div class="card">
      <form id="addForm">
        <input id="name" placeholder="Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="course" placeholder="Course" required>
        <button type="submit">Add</button>
      </form>
      <p class="msg" id="appMsg"></p>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("token");
let user = sessionStorage.getItem("user");
let mode = "login";

document.querySelectorAll("#authForm button").forEach(b =>
  b.addEventListener("click", () => { mode = b.dataset.mode; }));

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401 && token) { logout(); }
  const body = res.status === 204 ? {} : await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

function show() {
  const loggedIn = !!token;
  $("auth").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
  if (loggedIn) { $("who").textContent = "Signed in as " + user; loadStudents(); }
}

function logout() {
  token = null; user = null;
  sessionStorage.clear();
  show();
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const creds = { username: $("username").value, password: $("password").value };
  if (mode === "register") {
    const r = await api("/api/auth/register", { method: "POST", body: JSON.stringify(creds) });
    if (!r.ok) { $("authMsg").textContent = r.body.error || "Registration failed"; return; }
  }
  const r = await api("/api/auth/login", { method: "POST", body: JSON.stringify(creds) });
  if (!r.ok) { $("authMsg").textContent = r.body.error || "Login failed"; return; }
  token = r.body.token; user = r.body.username;
  sessionStorage.setItem("token", token); sessionStorage.setItem("user", user);
  $("authMsg").textContent = "";
  show();
});

$("logout").addEventListener("click", logout);

async function loadStudents() {
  const r = await api("/api/students");
  const tbody = $("rows");
  tbody.replaceChildren();
  if (!r.ok) return;
  r.body.forEach(s => {
    const tr = document.createElement("tr");
    [s.id, s.name, s.email, s.course].forEach(v => {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    });
    const td = document.createElement("td");
    const btn = document.createElement("button");
    btn.textContent = "Delete";
    btn.addEventListener("click", async () => {
      await api("/api/students/" + s.id, { method: "DELETE" });
      loadStudents();
    });
    td.appendChild(btn); tr.appendChild(td); tbody.appendChild(tr);
  });
}

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await api("/api/students", { method: "POST", body: JSON.stringify({
    name: $("name").value, email: $("email").value, course: $("course").value }) });
  $("appMsg").textContent = r.ok ? "" : (r.body.error || "Could not add student");
  if (r.ok) { e.target.reset(); loadStudents(); }
});

show();
</script>
</body>
</html>
